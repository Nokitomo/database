name: Update AnimeUnity database

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update due records or refresh the complete archive'
        type: choice
        options: [update, full]
        default: update
      stage:
        description: 'Run all phases or one phase only'
        type: choice
        options: [all, raw, mapped, final]
        default: all
      full_since:
        description: 'Internal continuation timestamp; leave blank when starting manually'
        required: false
      single_batch:
        description: Validate one saved batch without automatic continuation
        type: boolean
        default: false
      verify_only:
        description: Validate restored snapshot without scraping or publishing
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: animeunity-database-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      WARP_REQUIRED: '1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install and verify Cloudflare WARP
        timeout-minutes: 15
        run: bash providers/animeunity/scripts/setup-warp.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pipeline dependencies
        run: |
          bash providers/animeunity/scripts/check-warp.sh
          npm ci
      - name: Check pipeline logic
        run: npm run verify:all
      - name: Restore and verify AnimeUnity snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash providers/animeunity/scripts/checkpoint.sh restore
          npm run verify:data
      - name: Check out pinned Vega provider
        if: ${{ !inputs.verify_only }}
        run: |
          bash providers/animeunity/scripts/check-warp.sh
          git clone --filter=blob:none https://github.com/Nokitomo/vega-providers.git .cache/vega-providers
          revision=$(cat providers/animeunity/data/vega-providers.ref)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git -C .cache/vega-providers checkout "$revision"
          npm --prefix .cache/vega-providers ci
          npm --prefix .cache/vega-providers run build
          node providers/animeunity/scripts/check-provider-adapter.js .cache/vega-providers
          node .cache/vega-providers/tests/animeunity-tmdb.js
          node .cache/vega-providers/tests/animeunity-tvdb.js
          node .cache/vega-providers/tests/animeunity-anizip.js
          node .cache/vega-providers/tests/animeunity-anibridge.js
          node --test .cache/vega-providers/tests/animeunity-artwork-library.js
      - name: Update database with checkpoints
        if: ${{ !inputs.verify_only }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RUN_MODE: ${{ inputs.mode || 'update' }}
          RUN_STAGE: ${{ inputs.stage || 'all' }}
          RUN_FULL_SINCE: ${{ inputs.full_since || '' }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_SINGLE_BATCH: ${{ inputs.single_batch || false }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash providers/animeunity/scripts/check-warp.sh
          bash providers/animeunity/scripts/run-workflow.sh
