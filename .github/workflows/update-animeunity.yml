name: Update AnimeUnity database

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update due records or refresh the complete archive'
        type: choice
        options: [update, full]
        default: update
      stage:
        description: 'Run all phases or one phase only'
        type: choice
        options: [all, raw, mapped, final]
        default: all
      full_since:
        description: 'Internal continuation timestamp; leave blank when starting manually'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: animeunity-database-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      WARP_REQUIRED: '1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install and verify Cloudflare WARP
        timeout-minutes: 15
        run: bash scripts/setup-warp.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pipeline dependencies
        run: |
          bash scripts/check-warp.sh
          npm ci
      - name: Check pipeline logic
        run: npm run verify
      - name: Check out current Vega provider
        run: |
          bash scripts/check-warp.sh
          git clone --filter=blob:none https://github.com/Nokitomo/vega-providers.git .cache/vega-providers
          git -C .cache/vega-providers rev-parse HEAD > vega-providers.ref
          npm --prefix .cache/vega-providers ci
          npm --prefix .cache/vega-providers run build
          node .cache/vega-providers/tests/animeunity-tmdb.js
          node .cache/vega-providers/tests/animeunity-tvdb.js
          node .cache/vega-providers/tests/animeunity-anizip.js
          node .cache/vega-providers/tests/animeunity-anibridge.js
          node --test .cache/vega-providers/tests/animeunity-artwork-library.js
      - name: Update database with checkpoints
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RUN_MODE: ${{ inputs.mode || 'update' }}
          RUN_STAGE: ${{ inputs.stage || 'all' }}
          RUN_FULL_SINCE: ${{ inputs.full_since || '' }}
          RUN_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/check-warp.sh
          bash scripts/run-workflow.sh
