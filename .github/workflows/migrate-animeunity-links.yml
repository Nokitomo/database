name: Migrate AnimeUnity page links

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animeunity-database-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WARP_REQUIRED: '1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install and verify Cloudflare WARP
        timeout-minutes: 15
        run: bash scripts/setup-warp.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check migration logic
        run: npm run verify
      - name: Migrate existing final records
        run: |
          bash scripts/check-warp.sh
          node scripts/migrate-links.js
          node scripts/migrate-links.js --apply
          npm run verify:data
      - name: Publish migrated database
        run: |
          git add anime_database/final
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Migrate saved AnimeUnity page links"
            git pull --rebase origin main
            git push origin main
          fi
