name: Migrate AnimeUnity page links

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animeunity-database-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WARP_REQUIRED: '1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install and verify Cloudflare WARP
        timeout-minutes: 15
        run: bash providers/animeunity/scripts/setup-warp.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check migration logic
        run: npm run verify
      - name: Restore AnimeUnity snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash providers/animeunity/scripts/checkpoint.sh restore
          npm run verify:data
      - name: Migrate existing final records
        run: |
          bash providers/animeunity/scripts/check-warp.sh
          node providers/animeunity/scripts/migrate-links.js
          node providers/animeunity/scripts/migrate-links.js --apply
          node -e "const r=require('./providers/animeunity/scripts/migrate-links').migrateLinks(); console.log(r); if(r.changed) throw new Error('Link migration is incomplete');"
          npm run verify:data
      - name: Publish migrated database
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash providers/animeunity/scripts/checkpoint.sh publish
