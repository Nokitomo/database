name: Update cinema film and series database
on:
  # Scheduled runs paused while the primary catalogs are built. Manual runs remain available.
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated providers (kept unchanged by continuation runs)'
        type: string
        default: streamingunity
      stage:
        description: 'Merge source snapshots and fill missing metadata, or merge only'
        type: choice
        options: [all, merge]
        default: all
      recovery_attempt:
        description: 'Internal retry counter for failed runs'
        type: number
        default: 0
permissions:
  contents: write
  actions: write
concurrency:
  group: cinema-database-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    env:
      WARP_REQUIRED: '1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install and verify WARP
        run: bash shared/warp/setup.sh
        timeout-minutes: 15
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run verify:cinema
      - name: Build pinned external resolvers
        run: |
          bash shared/warp/check.sh
          git clone --filter=blob:none https://github.com/Nokitomo/vega-providers.git .cache/vega-providers
          git -C .cache/vega-providers checkout "$(cat vega-providers.ref)"
          npm --prefix .cache/vega-providers ci
          npm --prefix .cache/vega-providers run build
      - name: Merge and enrich with durable checkpoints
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CINEMA_SOURCES: ${{ inputs.sources || 'streamingunity' }}
          RUN_STAGE: ${{ inputs.stage || 'all' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash cinema/scripts/run-workflow.sh
      - name: Resume after a failed run
        if: ${{ failure() && inputs.stage != 'merge' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CINEMA_SOURCES: ${{ inputs.sources || 'streamingunity' }}
          CINEMA_RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || 0 }}
        run: |
          if (( CINEMA_RECOVERY_ATTEMPT >= 2 )); then
            echo 'CINEMA_RECOVERY_LIMIT: stopping after two consecutive recovery runs.'
            exit 0
          fi
          next_attempt=$(( CINEMA_RECOVERY_ATTEMPT + 1 ))
          for delay in 5 15 30; do
            if gh workflow run update-cinema.yml --ref main -f stage=all -f sources="$CINEMA_SOURCES" -f recovery_attempt="$next_attempt"; then
              echo "CINEMA_RECOVERY_QUEUED attempt=$next_attempt"
              exit 0
            fi
            sleep "$delay"
          done
          echo 'CINEMA_RECOVERY_DISPATCH_FAILED' >&2
          exit 1
      - name: Dispatch SQLite Lite publication after a successful checkpoint
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-cinema-sqlite-lite.yml --ref main
