name: Update unified anime database
on:
  # Enable after the initial unified merge via repository variable ANIME_SECONDARY_ENABLED=true.
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Merge source snapshots and enrich exclusive titles, or merge only'
        type: choice
        options: [all, merge]
        default: all
permissions:
  contents: write
  actions: write
concurrency:
  group: unified-database-main
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'schedule' || vars.ANIME_SECONDARY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    env:
      WARP_REQUIRED: '1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install and verify WARP
        run: bash shared/warp/setup.sh
        timeout-minutes: 15
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run verify:unified
      - name: Build pinned external resolvers
        if: inputs.stage != 'merge'
        run: |
          bash shared/warp/check.sh
          git clone --filter=blob:none https://github.com/Nokitomo/vega-providers.git .cache/vega-providers
          git -C .cache/vega-providers checkout "$(cat vega-providers.ref)"
          npm --prefix .cache/vega-providers ci
          npm --prefix .cache/vega-providers run build
      - name: Merge and enrich with durable checkpoints
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RUN_STAGE: ${{ inputs.stage || 'all' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash unified/scripts/run-workflow.sh
